model_name = "mmm_0_4"
# MMT / post-Keynesian prototype with:
#   * a fixed nominal JG wage as the labour-price anchor,
#   * regular government employment determined by desired public services,
#   * private employment determined by effective demand,
#   * a low-wage JG as the residual labour buffer,
#   * a simple gross-investment demand term.
#
# Units:
#   time   = year
#   labour = worker-years
#   nominal stocks/flows = currency units
#
# IMPORTANT: t = 50 therefore means FIFTY YEARS, not six months.

[parameters]
# ---------------------------------------------------------------------------
# Population and productivity
# ---------------------------------------------------------------------------
N0 = 100.0
beta = 0.01

A_F0 = 1.0
A_G0 = 1.0
A_JG0 = 0.5

alpha_F = 0.02
alpha_G = 0.02
alpha_JG = 0.01

# ---------------------------------------------------------------------------
# Nominal wage / price anchor
# ---------------------------------------------------------------------------
w_base = 1.0
w_JG = 0.6

# Regular public employment is deliberately preferable to the JG.
premium_G = 0.5
wage_gap_F = -0.2
# w_G = w_JG + premium_G*w_base = 1.1
# w_F = (1 + wage_gap_F)*w_G      = 0.88
# Hence: w_JG < w_F < w_G in the reference calibration.

p_goods_factor = 1.2

# ---------------------------------------------------------------------------
# Regular government services and procurement
# ---------------------------------------------------------------------------
# Government chooses a real public-service quantity per person rather than a
# fixed nominal payroll.  q_G_pc grows with public-sector productivity in the
# reference calibration, leaving regular public employment near a stable share
# of the labour force instead of shrinking mechanically as population grows.
q_G_pc0 = 0.12
gamma_G_service = 0.02

# Real government purchases of private-sector goods per person.
q_goods_pc = 0.10

# ---------------------------------------------------------------------------
# Taxes and household demand
# ---------------------------------------------------------------------------
r_H = 0.15
r_F = 0.05

c_w = 0.80
c_m = 0.05

# ---------------------------------------------------------------------------
# Private production, investment and hiring
# ---------------------------------------------------------------------------
monopoly = 0.20
eta_p = 0.35
tau_P = 1.0

# Gross private investment demand as a fraction of current private real output.
# This is a REAL-DEMAND closure only.  Bank-credit finance is deliberately left
# for a later model with explicit bank assets/liabilities and interest flows.
iota_F = 0.08

# Firms normally plan some spare productive capacity.  Effective demand is
# therefore compared with output at a target utilization below one.
u_F_target = 0.95

# Firm employment adjusts toward the demand-consistent level.
kappa_L = 1.5


# ---------------------------------------------------------------------------
# Optional model-owned admissibility limits
# ---------------------------------------------------------------------------
[limits.parameters.wage_gap_F]
min = -1.0
min_inclusive = false
description = "Firm wage multiplier (1 + wage_gap_F) must remain positive"

[limits.parameters.u_F_target]
min = 0.0
min_inclusive = false
max = 1.0
description = "Target private-sector utilization must lie in (0,1]"

[limits.parameters.iota_F]
min = 0.0
max = 1.0
description = "Gross investment-demand share must lie in [0,1]"

[limits.initial_conditions.lambda_F]
min = 0.0
max = 1.0
description = "Initial firm-employment fraction must lie in [0,1]"


[variables]
# F_D and W_D are private financial positions in this simplified consolidated
# accounting. G_N is the signed consolidated government net financial position.
# With the initial condition below, F_D + W_D + G_N = 0 and the Godley flows
# conserve that identity.
names = ["P", "lambda_F", "F_D", "W_D", "G_N"]


[initial_conditions]
P = 1.5
lambda_F = 0.95
F_D = 100.0
W_D = 100.0
G_N = -200.0


[equations.auxiliary]
# ---------------------------------------------------------------------------
# Demography and productivity
# ---------------------------------------------------------------------------
N = "N0 * exp(beta*t)"
A_F = "A_F0 * exp(alpha_F*t)"
A_G = "A_G0 * exp(alpha_G*t)"
A_JG = "A_JG0 * exp(alpha_JG*t)"

# ---------------------------------------------------------------------------
# Policy wages and government purchase price
# ---------------------------------------------------------------------------
w_G = "w_JG + premium_G*w_base"
w_F = "(1 + wage_gap_F)*w_G"

# The government goods bid is tied to the nominal wage anchor but allows the
# quantity price to fall with private productivity.
P_G = "p_goods_factor*w_base/A_F"

# ---------------------------------------------------------------------------
# Regular public employment first; JG only receives the residual labour pool
# ---------------------------------------------------------------------------
q_G_pc = "q_G_pc0 * exp(gamma_G_service*t)"
Q_G_des = "q_G_pc*N"
L_G = "Q_G_des/A_G"

N_res = "N - L_G"
L_F = "lambda_F*N_res"
U3 = "N_res - L_F"
L_JG = "(w_JG > 0.0)*U3"

L_total = "L_F + L_G + L_JG"
U_open = "N - L_total"

# Useful labour-share diagnostics.
lambda_G = "L_G/N"
lambda_JG = "L_JG/N"
lambda_regular = "(L_F + L_G)/N"
u3_rate = "U3/N"

# ---------------------------------------------------------------------------
# Real output
# ---------------------------------------------------------------------------
Q_F = "A_F*L_F"
Q_G = "A_G*L_G"
Q_JG = "A_JG*L_JG"
Q_total = "Q_F + Q_G + Q_JG"

# ---------------------------------------------------------------------------
# Government spending
# ---------------------------------------------------------------------------
G_G = "w_G*L_G"
G_JG = "w_JG*L_JG"

Q_goods = "q_goods_pc*N"
G_goods = "P_G*Q_goods"

G_total = "G_G + G_JG + G_goods"

# ---------------------------------------------------------------------------
# Household income and consumption
# ---------------------------------------------------------------------------
W_F = "w_F*L_F"
W_all = "W_F + G_G + G_JG"

T_H = "r_H*W_all"
C = "c_w*(W_all - T_H) + c_m*W_D"

# ---------------------------------------------------------------------------
# Private gross investment demand
# ---------------------------------------------------------------------------
# At this aggregation level investment is a purchase within the consolidated
# firm sector. It contributes to REAL final demand and desired production but
# does not create a net F_D -> F_D financial transfer.
I_real = "iota_F*Q_F"
I_nom = "P*I_real"

# ---------------------------------------------------------------------------
# Firm sales, taxes and effective demand
# ---------------------------------------------------------------------------
Sales_external = "C + G_goods"

# Turnover tax includes final consumption, government procurement and gross
# investment production, although the investment payment itself nets within
# the consolidated firm sector.
Taxable_F = "Sales_external + I_nom"
T_F = "r_F*Taxable_F"
T_total = "T_H + T_F"

# Real demand for private production.
Q_demand = "C/P + Q_goods + I_real"

# Firms plan spare capacity, so demand consistent output exceeds current demand
# by 1/u_F_target.
Q_required = "Q_demand/u_F_target"

# Normalized private-goods demand gap.
excess = "(Q_required - Q_F)/(A_F*N_res)"

# Diagnostic utilization ratio.
u_F = "Q_demand/Q_F"

# ---------------------------------------------------------------------------
# Private pricing
# ---------------------------------------------------------------------------
P_unit_cost = "w_F/A_F"
P_target = "(1 + monopoly)*P_unit_cost*exp(eta_p*excess)"
pi_rate = "tau_P*(P_target/P - 1)"

# ---------------------------------------------------------------------------
# Fiscal / national-account diagnostics
# ---------------------------------------------------------------------------
S_NG = "G_total - T_total"
NFA_private = "F_D + W_D"

# Expenditure-side nominal output proxy. Government purchases of private goods
# are already included in G_goods; regular public and JG services are valued at
# their payroll cost.
Y_exp_nom = "C + I_nom + G_goods + G_G + G_JG"


[godley]
# [source account, destination account, nominal flow/year, description]
#
# These flows preserve:
#     d(F_D + W_D + G_N)/dt = 0
#
# Investment is not listed because it is an intra-firm-sector purchase in this
# deliberately consolidated version.
T1 = ["F_D", "W_D", "W_F", "Firm wages"]
T2 = ["G_N", "W_D", "G_G", "Regular public-service payroll"]
T3 = ["G_N", "W_D", "G_JG", "JG buffer payroll"]
T4 = ["G_N", "F_D", "G_goods", "Government purchases of private goods"]
T5 = ["W_D", "F_D", "C", "Household consumption purchases"]
T6 = ["W_D", "G_N", "T_H", "Household wage-income tax"]
T7 = ["F_D", "G_N", "T_F", "Firm turnover tax"]


[equations.ode]
# Private price adjustment around the government-anchored nominal structure.
f_P = "tau_P*(P_target - P)"

# Firms hire or release labour according to effective demand.  The logistic
# factor keeps lambda_F inside (0,1) when started there.
f_lambda_F = "kappa_L*lambda_F*(1 - lambda_F)*excess"

# f_F_D, f_W_D and f_G_N are generated from [godley].


[tspan]
t0 = 0.0
t1 = 50.0


[solver]
dt = 0.1
method = "Tsit5"
adaptive = false
output_dt = 0.1
abstol = 1e-8
reltol = 1e-6


[plots]
time_series = [
    "P",
    "lambda_F",
    "lambda_G",
    "lambda_JG",
    "u3_rate",
    "L_F",
    "L_G",
    "L_JG",
    "Q_F",
    "Q_G",
    "Q_JG",
    "F_D",
    "W_D",
    "G_N",
    "pi_rate"
]
combine_stability_lyapunov_plots = false


[eigenvalues]
# This model is explicitly time-dependent through population/productivity
# growth, so instantaneous Jacobian eigenvalues should be interpreted locally.
all = false


[lyapunov]
enabled = true
renormalize_dt = 0.5
transient = 5.0
