model_name = "mmm_0_3"
# Government sector included, price ODE included, no Job Guarantee.
# This revision keeps only accounts that presently participate in the Godley
# transactions as dynamic financial states. The larger balance-sheet labels
# G_E, B_E, F_L and W_L remain reserved for a later model extension.

[parameters]
N0 = 100.0       # Total labor force t=0
A0 = 1.0         # Initial productivity
K0 = 100.0       # Reference capital stock t=0 (currently unused)
cG = 0.3         # Government spending factor / output share
varpi = 0.1      # Wage-share response to employment
nu = 2.5         # Capital-output ratio
alpha = 0.02     # Productivity growth
beta = 0.01      # Population growth rate
monopoly = 0.2   # Markup percentage on firm costs
s = 0.2          # Savings desire (currently unused)
Phi_d = 0.05     # Phillips multiplier
Phi_c = 1.0      # Phillips offset
gamma_p = 2.0    # Phillips exponent
deprec = 0.05    # Capital depreciation constant
tau_P = 0.1      # Price adjustment speed

# Investment response parameters: power law
ai = 0.05
bi = 0.05
ci = 1.75
di = 0.0
gamma_i = 2.0

rT = 0.34        # Effective equivalent tax rate
rW = 0.6         # Household share of total tax flow
iG = 0.03        # Government policy rate
sigma_F = 0.37   # Share of government interest income paid to firms

[variables]
# Active Godley accounts:
# G_D = government debt/bond account
# G_T = government tax-record account
# F_D = firm deposits
# W_D = household deposits
# Macro states:
# P = price level
# D = aggregate private/NG debt proxy
# u = wage share
# lambda = employment rate
names = ["G_D", "G_T", "F_D", "W_D", "P", "D", "u", "lambda"]

[initial_conditions]
# Keep this order aligned with [variables].names for the current generator.
G_D = 0.0
G_T = 0.0
F_D = 0.0
W_D = 0.0
P = 1.0
D = 50.0
u = 0.6
lambda = 0.9

[equations.auxiliary]
A = "A0 * exp(alpha * t)"
N = "N0 * exp(beta * t)"
Yr = "lambda * A * N"
Y = "Yr * P"
L = "lambda * N"
K = "nu * Y"

# Fiscal functions
G = "cG * Y"
T = "rT * Y"

# Main response functions
Phi = "Phi_d/(1 - lambda)^gamma_p - Phi_c"
Gamma = "(1 - u)/nu - deprec"

# Profit equation; government interest income is included through iG.
Pi = "Y - u*A*L + iG*D"
pi = "Pi/K"

# Investment curve
Inv = "ai / (bi + ci * pi)^gamma_i - di"
S = "G - T + Inv * Y"

[godley]
# [source account, destination account, nominal flow, description]
T1 = ["F_D", "W_D", "u*lambda*A*N", "Worker wages"]
T2 = ["G_D", "F_D", "sigma_F*iG*G_D", "Interest to firms"]
T3 = ["G_D", "W_D", "(1 - sigma_F)*iG*G_D", "Interest to households"]
# T is already the total tax flow, so rW partitions it between sectors.
T4 = ["F_D", "G_T", "(1 - rW)*T", "Corporate tax revenue"]
T5 = ["W_D", "G_T", "rW*T", "Household tax revenue"]

[equations.ode]
# Price is cost + markup.
f_P = "tau_P * (u/(1 - monopoly) - P)"
# Debt/fiscal balance.
f_D = "G - T"
# Adjust employment rate toward output-labour balance.
f_lambda = "lambda * (Gamma - deprec - alpha - beta)"
# Wage share responds to labour-market pressure and price/employment dynamics.
f_u = "u * (Phi + varpi * f_lambda / lambda + f_P / P - alpha)"
# f_G_D, f_G_T, f_F_D and f_W_D are supplied by [godley].

[tspan]
t0 = 0.0
t1 = 50.0

[solver]
dt = 0.1
method = "Tsit5"

[plots]
time_series = ["P", "D", "lambda", "u", "G_D", "G_T", "F_D", "W_D"]
combine_stability_lyapunov_plots = false

[eigenvalues]
all = true

[lyapunov]
enabled = true
renormalize_dt = 0.1
transient = 5.0
